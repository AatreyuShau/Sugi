page:
  id: ui_showcase
  width: 1280
  height: 720
  background: "#07111f"
  children:
    - type: text
      id: title
      text: "UI, layout, text, events"
      x: 48
      y: 72
      color: "#e0f2fe"
      font_size: 34
      weight: 800
      components:
        - type: Text
          value: "UI, layout, text, events"
          weight: 800
          alignment: left
          wrapping: true
          tracking: 0.3
          line_height: 1.2
          drop_shadow: true
    - type: panel
      id: flex_panel
      class: card interactive
      x: 48
      y: 110
      width: 520
      height: 360
      color: "#172554"
      radius: 28
      styles:
        layout: flex
        gap: 16
      events:
        click:
          - call: select_card
      components:
        - type: Transform
          opacity: 0.96
        - type: Glow
          strength: 0.35
      children:
        - type: button
          id: primary_action
          text: "Dispatch event"
          class: cta
          x: 84
          y: 174
          width: 220
          height: 64
          color: "#38bdf8"
          text_color: "#082f49"
          radius: 18
          on_click:
            - call: application_handles_logic
        - type: button
          id: secondary_action
          text: "Play animation"
          x: 326
          y: 174
          width: 200
          height: 64
          color: "#a78bfa"
          text_color: "#1e1b4b"
          radius: 18
          animations:
            hover:
              scale:
                from: 1
                to: 1.08
    - type: scroll_region
      id: scroll_features
      x: 620
      y: 110
      width: 560
      height: 360
      color: "#0f172a"
      radius: 28
      components:
        - type: ScrollLock
          start: 120
          end: 580
        - type: Blur
          radius: 14
      children:
        - type: text
          id: scroll_text
          text: "Scroll regions, sticky panels, viewport variables and subscriptions are declarative scene features."
          x: 656
          y: 172
          color: "#cbd5e1"
          font_size: 22
          max_width: 470
