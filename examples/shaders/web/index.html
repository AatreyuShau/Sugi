<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SUGI Shader Showcase</title>
  <style>
    html, body { margin: 0; height: 100%; background: #020617; color: #e2e8f0; font-family: system-ui, sans-serif; }
    canvas { width: 100vw; height: 100vh; display: block; }
    aside { position: fixed; left: 16px; bottom: 16px; padding: 10px 12px; border: 1px solid #334155; border-radius: 12px; background: rgba(15,23,42,.72); backdrop-filter: blur(12px); font-size: 13px; }
  </style>
</head>
<body>
<canvas id="surface"></canvas>
<aside>SUGI loads app-owned vertex/fragment shaders and image sprites; the app only runs the renderer.</aside>
<script type="module">
import { SugiWebGLRenderer } from '../../shared/sugi-webgl-renderer.js';
const renderer = new SugiWebGLRenderer(document.getElementById('surface'), { baseUrl: '../../' });
const scene = await fetch('render_tree.json').then((response) => response.json());
await renderer.loadScene(scene);
function frame(now) { renderer.render(now / 1000); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
</body>
</html>
