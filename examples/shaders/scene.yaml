materials:
  sky:
    vertex: assets/shaders/screen.vert
    fragment: assets/shaders/sky.frag
    uniforms:
      time: 0
  water:
    vertex: assets/shaders/screen.vert
    fragment: assets/shaders/water.frag
    uniforms:
      time: 0
      amplitude: 0.2
  hologram:
    vertex: assets/shaders/screen.vert
    fragment: assets/shaders/hologram.frag
    uniforms:
      strength: 0.7
  bloom:
    vertex: assets/shaders/screen.vert
    fragment: assets/shaders/bloom.frag
page:
  id: shader_showcase
  width: 1280
  height: 720
  background: "#020617"
  children:
    - type: text
      id: title
      text: "Application GLSL materials, uniforms, render targets"
      x: 48
      y: 68
      color: "#f8fafc"
      font_size: 34
    - type: shader_surface
      id: sky_material_pass
      material: sky
      x: 48
      y: 120
      width: 360
      height: 220
      color: "#22d3ee"
      components:
        - type: ShaderMaterial
          material: sky
          vertex: assets/shaders/screen.vert
          fragment: assets/shaders/sky.frag
          uniforms:
            time: 0
    - type: sprite
      id: hologram_sprite
      material: hologram
      x: 460
      y: 120
      width: 360
      height: 220
      color: "#8b5cf6"
      blend: additive
      components:
        - type: ShaderMaterial
          material: hologram
          vertex: assets/shaders/screen.vert
          fragment: assets/shaders/hologram.frag
          uniforms:
            strength: 0.7
    - type: shader_surface
      id: water_material_pass
      material: water
      x: 872
      y: 120
      width: 360
      height: 220
      color: "#0ea5e9"
      components:
        - type: ShaderMaterial
          material: water
          vertex: assets/shaders/screen.vert
          fragment: assets/shaders/water.frag
          uniforms:
            time: 0
            amplitude: 0.2
    - type: viewport
      id: postprocess_viewport
      x: 48
      y: 390
      width: 1184
      height: 160
      color: "#0f172a"
      postprocess:
        fragment: assets/shaders/bloom.frag
      components:
        - type: RenderTarget
          pool: shared
        - type: ShaderMaterial
          material: bloom
          vertex: assets/shaders/screen.vert
          fragment: assets/shaders/bloom.frag
