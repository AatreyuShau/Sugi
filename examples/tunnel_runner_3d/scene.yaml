page:
  id: tunnel_runner_scene
  width: 960
  height: 540
  background: "#020617"
  variables:
    speed: 18
    lane: 0
  children:
    - type: camera
      id: runner_camera
      fov: 72
      components:
        - type: Camera3D
          projection: perspective
    - type: player
      id: hovercraft
      lane: 0
      color: "#38bdf8"
      components:
        - type: Transform3D
          x: 0
          y: -0.7
          z: 1.2
        - type: HovercraftController
          lanes: 3
    - type: obstacle
      id: gate_left
      lane: -1
      z: 18
      color: "#fb7185"
      components:
        - type: Box3D
          width: 1.1
          height: 1.4
          depth: 1.1
    - type: obstacle
      id: gate_right
      lane: 1
      z: 30
      color: "#f97316"
      components:
        - type: Box3D
          width: 1.1
          height: 1.4
          depth: 1.1
    - type: collectible
      id: energy_ring
      lane: 0
      z: 24
      color: "#facc15"
      components:
        - type: Ring3D
          radius: 0.6
