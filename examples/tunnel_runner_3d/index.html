<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SUGI Tunnel Runner</title>
  <style>
    html, body, canvas { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #020617; }
    canvas { display: block; }
  </style>
</head>
<body>
<canvas id="surface"></canvas>
<script>
const canvas = document.getElementById('surface');
const ctx = canvas.getContext('2d');
const lanes = [-2.2, 0, 2.2];
let width = 960;
let height = 540;
let lane = 1;
let score = 0;
let speed = 18;
let objects = [];
let last = performance.now();

function flatten(nodes, out = []) {
  for (const node of nodes) {
    out.push(node);
    flatten(node.children || [], out);
  }
  return out;
}

function resize() {
  canvas.width = innerWidth * devicePixelRatio;
  canvas.height = innerHeight * devicePixelRatio;
}

function project(x, y, z) {
  const depth = Math.max(1, z);
  const scale = 520 / depth;
  return { x: width / 2 + x * scale, y: height * 0.66 + y * scale, scale };
}

function resetObject(object, index) {
  object.z = 22 + index * 8 + Math.random() * 8;
  object.laneIndex = Math.floor(Math.random() * 3);
}

function update(dt) {
  for (let i = 0; i < objects.length; i++) {
    const object = objects[i];
    object.z -= speed * dt;
    if (object.z < 1.2) {
      if (object.kind === 'obstacle' && object.laneIndex === lane) score = Math.max(0, score - 50);
      if (object.kind === 'collectible' && object.laneIndex === lane) score += 100;
      resetObject(object, i);
    }
  }
  score += dt * 10;
}

function drawTunnel() {
  const gradient = ctx.createLinearGradient(0, 0, 0, height);
  gradient.addColorStop(0, '#020617');
  gradient.addColorStop(1, '#111827');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, width, height);
  ctx.strokeStyle = '#1e40af';
  ctx.lineWidth = 2;
  for (let z = 2; z < 42; z += 4) {
    const left = project(-4, 1.2, z);
    const right = project(4, 1.2, z);
    const floorLeft = project(-4, -1.2, z);
    const floorRight = project(4, -1.2, z);
    ctx.strokeRect(left.x, left.y, right.x - left.x, floorLeft.y - left.y);
    ctx.beginPath();
    ctx.moveTo(floorLeft.x, floorLeft.y);
    ctx.lineTo(floorRight.x, floorRight.y);
    ctx.stroke();
  }
  for (const x of lanes) {
    const near = project(x, -1.2, 2);
    const far = project(x, -1.2, 42);
    ctx.beginPath();
    ctx.moveTo(near.x, near.y);
    ctx.lineTo(far.x, far.y);
    ctx.stroke();
  }
}

function drawObjects() {
  const sorted = [...objects].sort((a, b) => b.z - a.z);
  for (const object of sorted) {
    const p = project(lanes[object.laneIndex], -0.6, object.z);
    if (object.kind === 'collectible') {
      ctx.strokeStyle = object.color;
      ctx.lineWidth = Math.max(3, p.scale * 0.03);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.scale * 0.42, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.fillStyle = object.color;
      ctx.fillRect(p.x - p.scale * 0.38, p.y - p.scale * 0.9, p.scale * 0.76, p.scale * 0.9);
    }
  }
  const player = project(lanes[lane], -0.95, 1.8);
  ctx.fillStyle = '#38bdf8';
  ctx.beginPath();
  ctx.moveTo(player.x, player.y - 45);
  ctx.lineTo(player.x - 42, player.y + 32);
  ctx.lineTo(player.x + 42, player.y + 32);
  ctx.closePath();
  ctx.fill();
}

function draw() {
  const scale = Math.min(canvas.width / width, canvas.height / height);
  const ox = (canvas.width - width * scale) / 2;
  const oy = (canvas.height - height * scale) / 2;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(scale, 0, 0, scale, ox, oy);
  drawTunnel();
  drawObjects();
  ctx.fillStyle = '#e2e8f0';
  ctx.font = '700 24px system-ui, sans-serif';
  ctx.fillText(`Score ${Math.floor(score)}`, 24, 40);
  ctx.font = '16px system-ui, sans-serif';
  ctx.fillText('A/D or ←/→ to switch lanes', 24, 66);
}

function frame(now) {
  update(Math.min(0.033, (now - last) / 1000));
  draw();
  last = now;
  requestAnimationFrame(frame);
}

async function boot() {
  const tree = await fetch('render_tree.json').then(response => response.json());
  const nodes = flatten(tree);
  const root = nodes.find(node => node.type === 'page');
  width = Number(root.properties.width);
  height = Number(root.properties.height);
  objects = nodes.filter(node => ['obstacle', 'collectible'].includes(node.type)).map((node, index) => ({
    kind: node.type,
    color: node.properties.color,
    z: Number(node.properties.z || 18 + index * 8),
    laneIndex: Number(node.properties.lane || 0) + 1
  }));
  requestAnimationFrame(frame);
}

addEventListener('resize', resize);
addEventListener('keydown', event => {
  if (['a', 'ArrowLeft'].includes(event.key)) lane = Math.max(0, lane - 1);
  if (['d', 'ArrowRight'].includes(event.key)) lane = Math.min(2, lane + 1);
});
resize();
boot();
</script>
</body>
</html>
