page:
  id: portfolio_page
  width: 1440
  height: 4200
  background: "#050816"
  variables:
    accent: "#8b5cf6"
    scroll_lock_start: 1180
    scroll_lock_end: 1980
  children:
    - type: shader
      id: aurora_background
      x: 0
      y: 0
      width: 1440
      height: 900
      shader: aurora
      color_a: "#22d3ee"
      color_b: "#8b5cf6"
      color_c: "#f472b6"
      components:
        - type: FullFrameShader
          shader: aurora
          uniforms:
            intensity: 0.85
            speed: 0.24
    - type: pen
      id: mouse_trails
      x: 0
      y: 0
      width: 1440
      height: 900
      components:
        - type: PenLayer
          mode: additive
          brush: glowing_polyline
          max_points: 42
    - type: section
      id: hero
      x: 96
      y: 110
      width: 1248
      height: 720
      components:
        - type: Sprite
          shader: glass_panel
          radius: 36
    - type: text
      id: eyebrow
      x: 150
      y: 175
      text: "SUGI PORTFOLIO TEMPLATE"
      color: "#67e8f9"
      components:
        - type: Text
          size: 18
          tracking: 4
    - type: text
      id: hero_title
      x: 148
      y: 235
      text: "Interfaces that feel alive."
      color: "#f8fafc"
      components:
        - type: Text
          size: 82
          weight: 800
    - type: text
      id: hero_body
      x: 154
      y: 440
      text: "A canvas-rendered portfolio with shader sprites, pen trails, scroll-locked storytelling, and interactive depth."
      color: "#cbd5e1"
      components:
        - type: Text
          size: 26
          max_width: 710
    - type: sprite
      id: hologram_card
      x: 950
      y: 188
      width: 290
      height: 390
      shader: hologram
      image: "generated://orbital-card"
      components:
        - type: ImageSprite
          source: "generated://orbital-card"
          fit: cover
        - type: ShaderSprite
          shader: hologram
          uniforms:
            scanline_strength: 0.25
    - type: section
      id: scroll_lock_story
      x: 0
      y: 1040
      width: 1440
      height: 1100
      lock: true
      components:
        - type: ScrollLock
          start: 1180
          end: 1980
    - type: shader
      id: lock_shader
      x: 80
      y: 1100
      width: 1280
      height: 760
      shader: grid_warp
      components:
        - type: FullFrameShader
          shader: grid_warp
          uniforms:
            density: 18
            warp: 0.42
    - type: text
      id: lock_title
      x: 160
      y: 1180
      text: "Scroll locks midway. The scene keeps evolving."
      color: "#ffffff"
      components:
        - type: Text
          size: 56
          weight: 800
    - type: text
      id: lock_caption
      x: 170
      y: 1340
      text: "The page pauses the narrative band while shader nodes, sprite nodes, and pen layers keep animating inside the render tree."
      color: "#dbeafe"
      components:
        - type: Text
          size: 24
          max_width: 720
    - type: sprite
      id: case_study_alpha
      x: 125
      y: 2350
      width: 360
      height: 460
      shader: gradient_noise
      image: "generated://case-alpha"
      components:
        - type: ImageSprite
          source: "generated://case-alpha"
          fit: cover
        - type: ShaderSprite
          shader: gradient_noise
    - type: sprite
      id: case_study_beta
      x: 540
      y: 2250
      width: 360
      height: 560
      shader: liquid_glass
      image: "generated://case-beta"
      components:
        - type: ImageSprite
          source: "generated://case-beta"
          fit: cover
        - type: ShaderSprite
          shader: liquid_glass
    - type: sprite
      id: case_study_gamma
      x: 955
      y: 2350
      width: 360
      height: 460
      shader: chromatic_edge
      image: "generated://case-gamma"
      components:
        - type: ImageSprite
          source: "generated://case-gamma"
          fit: cover
        - type: ShaderSprite
          shader: chromatic_edge
    - type: text
      id: work_title
      x: 120
      y: 2180
      text: "Selected work as renderable sprites"
      color: "#f8fafc"
      components:
        - type: Text
          size: 48
          weight: 800
    - type: pen
      id: signature_pen
      x: 0
      y: 3100
      width: 1440
      height: 520
      components:
        - type: PenLayer
          mode: normal
          brush: pressure_ribbon
          max_points: 128
    - type: text
      id: closing
      x: 180
      y: 3330
      text: "Draw, shade, compose, and ship."
      color: "#ffffff"
      components:
        - type: Text
          size: 70
          weight: 900
