page:
  id: gallery_showcase
  width: 1280
  height: 720
  background: "#111827"
  children:
    - type: text
      id: title
      text: "Images, sprites, UVs, nine-slice, blend modes"
      x: 48
      y: 70
      color: "#f8fafc"
      font_size: 34
    - type: image
      id: card_png
      image: assets/card.png
      x: 48
      y: 120
      width: 260
      height: 340
      color: "#1d4ed8"
      components:
        - type: ImageSprite
          source: assets/card.png
          cache: async
          format: png
    - type: sprite
      id: nine_slice_panel
      image: assets/panel.webp
      x: 360
      y: 120
      width: 260
      height: 340
      color: "#581c87"
      components:
        - type: ImageSprite
          source: assets/panel.webp
          nine_slice: [24, 24, 24, 24]
          color_overlay: "rgba(168,85,247,.32)"
    - type: sprite
      id: atlas_sprite
      image: assets/atlas.svg
      x: 672
      y: 120
      width: 260
      height: 340
      color: "#064e3b"
      components:
        - type: Sprite
          texture: assets/atlas.svg
          uv_region: [0, 0, 0.5, 0.5]
          blend_mode: screen
    - type: sprite
      id: multi_texture
      x: 984
      y: 120
      width: 220
      height: 340
      color: "#7f1d1d"
      components:
        - type: ShaderSprite
          shader: liquid_glass
          textures: [assets/albedo.jpg, assets/normal.webp]
