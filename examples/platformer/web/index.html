<script>
const DESIGN_WIDTH = 960;
const DESIGN_HEIGHT = 540;
const canvas = document.getElementById('surface');
const ctx = canvas.getContext('2d');
const keys = new Set();
const imageCache = new Map();
let nodes = [];
let roots = [];
let player;
let solids = [];
let goal;
let world = { gravity: 1600, move_speed: 340, jump_velocity: -650, world_width: 2600 };
let cameraX = 0;
let won = false;

function flatten(input, output = []) { for (const node of input) { output.push(node); flatten(node.children || [], output); } return output; }
function resize() { canvas.width = window.innerWidth * devicePixelRatio; canvas.height = window.innerHeight * devicePixelRatio; canvas.style.width = `${window.innerWidth}px`; canvas.style.height = `${window.innerHeight}px`; }
function overlaps(a, b) { return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y; }
function nodeRect(node) { const p = node.properties; return { x: Number(p.x), y: Number(p.y), width: Number(p.width), height: Number(p.height) }; }
function classes(node) { return String(node.properties.class || '').split(/\s+/); }
function imageFor(src) { if (!src) return null; if (!imageCache.has(src)) { const img = new Image(); img.src = `../../${src}`; imageCache.set(src, img); } return imageCache.get(src); }
function shaderGradient(p, phase = 0) { const g = ctx.createLinearGradient(p.x - cameraX * Number(p.parallax ?? 1), 0, p.x + Number(p.width), Number(p.height)); g.addColorStop(0, '#0284c7'); g.addColorStop(.42 + Math.sin(phase) * .08, '#7c3aed'); g.addColorStop(1, '#fb7185'); return g; }
function drawWater(p, phase) { const x0 = Number(p.x) - cameraX; const y = Number(p.y); const w = Number(p.width); ctx.fillStyle = 'rgba(7, 89, 133, .72)'; ctx.fillRect(x0, y + 18, w, Number(p.height)); ctx.lineCap = 'round'; for (let pass = 0; pass < 3; pass++) { ctx.beginPath(); for (let x = 0; x <= w; x += 16) { const yy = y + 24 + Math.sin((x + phase * (80 + pass * 18)) / (90 + pass * 30)) * (12 + pass * 3); x ? ctx.lineTo(x0 + x, yy) : ctx.moveTo(x0 + x, yy); } ctx.strokeStyle = [`rgba(103,232,249,.75)`,`rgba(56,189,248,.38)`,`rgba(14,165,233,.28)`][pass]; ctx.lineWidth = [5, 10, 18][pass]; ctx.stroke(); } }
function drawNode(node, phase) { const p = node.properties || {}; if (node.type === 'shader_surface') { const parallax = Number(p.parallax ?? 1); ctx.fillStyle = shaderGradient(p, phase); ctx.fillRect(Number(p.x) - cameraX * parallax, Number(p.y), Number(p.width), Number(p.height)); return; } if (node.type === 'pen') { drawWater(p, phase); return; } if (node.type === 'platform' || node.type === 'sprite') { const x = Number(p.x) - cameraX; const y = Number(p.y); const w = Number(p.width); const h = Number(p.height); if (x + w < -80 || x > DESIGN_WIDTH + 80) return; if (node === player.node) { const img = imageFor(p.source || p.image); if (img && img.complete && img.naturalWidth) ctx.drawImage(img, x, y, w, h); else { ctx.fillStyle = p.color || '#66e3ff'; ctx.fillRect(x, y, w, h); } return; } ctx.fillStyle = p.shader ? shaderGradient({ ...p, x }, phase) : (p.color || '#ffffff'); ctx.beginPath(); ctx.roundRect(x, y, w, h, Number(p.radius || (node.type === 'platform' ? 6 : 14))); ctx.fill(); } if (node.type === 'text') { ctx.fillStyle = p.color || '#ffffff'; ctx.font = `${p.weight || 700} ${p.font_size || 20}px system-ui, sans-serif`; ctx.fillText(p.text, Number(p.x), Number(p.y)); } }
function update(dt) { const left = keys.has('a') || keys.has('arrowleft'); const right = keys.has('d') || keys.has('arrowright'); const jump = keys.has('w') || keys.has(' ') || keys.has('arrowup'); player.vx = (left ? -world.move_speed : 0) + (right ? world.move_speed : 0); if (jump && player.grounded) { player.vy = world.jump_velocity; player.grounded = false; } player.vy += world.gravity * dt; player.x += player.vx * dt; player.y += player.vy * dt; player.grounded = false; for (const solid of solids) { const rect = nodeRect(solid); if (overlaps(player, rect) && player.vy >= 0 && player.y + player.height - player.vy * dt <= rect.y + 8) { player.y = rect.y - player.height; player.vy = 0; player.grounded = true; } } player.x = Math.max(0, Math.min(world.world_width - player.width, player.x)); if (player.y > DESIGN_HEIGHT + 180) Object.assign(player, { x: 96, y: 364, vx: 0, vy: 0 }); Object.assign(player.node.properties, { x: player.x, y: player.y }); cameraX += (Math.max(0, Math.min(world.world_width - DESIGN_WIDTH, player.x - DESIGN_WIDTH * .42)) - cameraX) * .12; won = overlaps(player, nodeRect(goal)); }
function draw(now) { const scale = Math.min(canvas.width / DESIGN_WIDTH, canvas.height / DESIGN_HEIGHT); const ox = (canvas.width - DESIGN_WIDTH * scale) / 2; const oy = (canvas.height - DESIGN_HEIGHT * scale) / 2; ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle = '#06111f'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.setTransform(scale,0,0,scale,ox,oy); for (const node of nodes) drawNode(node, now / 1000); ctx.fillStyle = '#e2e8f0'; ctx.font = '600 14px system-ui'; ctx.fillText(`camera x ${Math.round(cameraX)} / ${world.world_width - DESIGN_WIDTH}`, 24, 60); if (won) { ctx.fillStyle = '#facc15'; ctx.font = '800 36px system-ui'; ctx.textAlign = 'center'; ctx.fillText('You reached the hologram gate!', DESIGN_WIDTH / 2, 118); ctx.textAlign = 'start'; } }
let last = performance.now(); function frame(now) { update(Math.min(.033, (now - last) / 1000)); draw(now); last = now; requestAnimationFrame(frame); }
async function boot() { { const embedded = document.getElementById('render-tree-data')?.textContent; roots = embedded ? JSON.parse(embedded) : await fetch('render_tree.json').then(r => { if (!r.ok) throw new Error('Run from a static server so render_tree.json can be fetched.'); return r.json(); }); } nodes = flatten(roots); const root = nodes.find(node => node.type === 'page'); world = { ...world, ...root.properties, ...root.variables }; const playerNode = nodes.find(node => classes(node).includes('player')); player = { ...nodeRect(playerNode), vx: 0, vy: 0, grounded: false, node: playerNode }; solids = nodes.filter(node => classes(node).includes('solid')); goal = nodes.find(node => classes(node).includes('goal')); requestAnimationFrame(frame); }
addEventListener('resize', resize); addEventListener('keydown', event => keys.add(event.key.toLowerCase())); addEventListener('keyup', event => keys.delete(event.key.toLowerCase())); resize(); boot().catch(error => { ctx.fillStyle = '#f87171'; ctx.font = '20px monospace'; ctx.fillText(error.message, 24, 48); });
</script>
