<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SUGI Horizontal Platformer</title>
  <style>
    html, body, canvas { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #06111f; }
    canvas { display: block; }
    #hud { position: fixed; left: 20px; top: 18px; color: #e2e8f0; font: 600 14px system-ui; }
  </style>
</head>
<body>
<canvas id="surface"></canvas>
<div id="hud">A/D or arrows to run · W/Space to jump · reach the hologram gate</div>
<script type="module">
import { SugiWebGLRenderer } from '../../shared/sugi-webgl-renderer.js';

const DESIGN_WIDTH = 960;
const DESIGN_HEIGHT = 540;
const keys = new Set();
let nodes = [];
let roots = [];
let player;
let solids = [];
let goal;
let world = { gravity: 1600, move_speed: 340, jump_velocity: -650, world_width: 2600 };
let cameraX = 0;
const hud = document.getElementById('hud');
const renderer = new SugiWebGLRenderer(document.getElementById('surface'), { baseUrl: '../../' });

function flatten(input, output = []) { for (const node of input) { output.push(node); flatten(node.children || [], output); } return output; }
function overlaps(a, b) { return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y; }
function nodeRect(node) { const p = node.properties; return { x: Number(p.x), y: Number(p.y), width: Number(p.width), height: Number(p.height) }; }
function classes(node) { return String(node.properties.class || '').split(/\s+/); }

function update(dt) {
  const left = keys.has('a') || keys.has('arrowleft');
  const right = keys.has('d') || keys.has('arrowright');
  const jump = keys.has('w') || keys.has(' ') || keys.has('arrowup');
  player.vx = (left ? -world.move_speed : 0) + (right ? world.move_speed : 0);
  if (jump && player.grounded) { player.vy = world.jump_velocity; player.grounded = false; }
  player.vy += world.gravity * dt;
  player.x += player.vx * dt;
  player.y += player.vy * dt;
  player.grounded = false;
  for (const solid of solids) {
    const rect = nodeRect(solid);
    if (overlaps(player, rect) && player.vy >= 0 && player.y + player.height - player.vy * dt <= rect.y + 8) {
      player.y = rect.y - player.height;
      player.vy = 0;
      player.grounded = true;
    }
  }
  player.x = Math.max(0, Math.min(world.world_width - player.width, player.x));
  if (player.y > DESIGN_HEIGHT + 180) Object.assign(player, { x: 96, y: 364, vx: 0, vy: 0 });
  Object.assign(player.node.properties, { x: player.x, y: player.y });
  cameraX += (Math.max(0, Math.min(world.world_width - DESIGN_WIDTH, player.x - DESIGN_WIDTH * .42)) - cameraX) * .12;
  const won = overlaps(player, nodeRect(goal));
  hud.textContent = won ? 'You reached the hologram gate!' : `A/D or arrows to run · W/Space to jump · camera ${Math.round(cameraX)}`;
}

let last = performance.now();
async function frame(now) {
  update(Math.min(.033, (now - last) / 1000));
  await renderer.render(now / 1000, cameraX);
  last = now;
  requestAnimationFrame(frame);
}

async function boot() {
  roots = await fetch('render_tree.json').then((response) => response.json());
  nodes = flatten(roots);
  const root = nodes.find((node) => node.type === 'page');
  world = { ...world, ...root.properties, ...root.variables };
  const playerNode = nodes.find((node) => classes(node).includes('player'));
  player = { ...nodeRect(playerNode), vx: 0, vy: 0, grounded: false, node: playerNode };
  solids = nodes.filter((node) => classes(node).includes('solid'));
  goal = nodes.find((node) => classes(node).includes('goal'));
  await renderer.loadScene(roots);
  requestAnimationFrame(frame);
}

addEventListener('keydown', (event) => keys.add(event.key.toLowerCase()));
addEventListener('keyup', (event) => keys.delete(event.key.toLowerCase()));
boot().catch((error) => { hud.textContent = error.message; hud.style.color = '#f87171'; });
</script>
</body>
</html>
