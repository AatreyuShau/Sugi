materials:
  sky:
    vertex: assets/shaders/screen.vert
    fragment: assets/shaders/sky.frag
    uniforms:
      time: 0
  clouds:
    vertex: assets/shaders/screen.vert
    fragment: assets/shaders/clouds.frag
    uniforms:
      time: 0
  water:
    vertex: assets/shaders/screen.vert
    fragment: assets/shaders/water.frag
    uniforms:
      time: 0
      amplitude: 0.18
  hologram:
    vertex: assets/shaders/screen.vert
    fragment: assets/shaders/hologram.frag
    uniforms:
      strength: 0.45
page:
  id: platformer_scene
  styles:
    layout: absolute
  width: 960
  height: 540
  world_width: 2600
  background: "#06111f"
  variables:
    gravity: 1600
    move_speed: 340
    jump_velocity: -650
  children:
    - type: shader_surface
      id: shader_sky
      material: sky
      x: 0
      y: 0
      width: 2600
      height: 360
      color: "#0ea5e9"
      strength: 0.78
      parallax: 0.18
      components:
        - type: FullFrameShader
          material: sky
        - type: Camera
          parallax: 0.18
    - type: shader_surface
      id: distant_clouds
      material: clouds
      x: 0
      y: 48
      width: 2600
      height: 210
      color: "#8b5cf6"
      strength: 0.4
      parallax: 0.35
      components:
        - type: PostProcessShader
          material: clouds
    - type: camera
      id: camera
      x: 0
      y: 0
      width: 960
      height: 540
      components:
        - type: Transform
          x: 0
          y: 0
        - type: Camera
          target: player
          follow_axis: x
          zoom: 1
    - type: shader_surface
      id: water_backdrop
      material: water
      x: 0
      y: 430
      width: 2600
      height: 110
      color: "#075985"
      parallax: 1
      components:
        - type: ShaderMaterial
          material: water
          vertex: assets/shaders/screen.vert
          fragment: assets/shaders/water.frag
          uniforms:
            time: 0
            amplitude: 0.18
    - type: pen
      id: sine_water
      x: 0
      y: 458
      width: 2600
      height: 82
      color: "#075985"
      stroke: "#67e8f9"
      parallax: 1
      components:
        - type: PenLayer
          brush: glowing_trail
          mode: sine_wave
          amplitude: 16
          wavelength: 150
          history_limit: 260
          glow: true
    - type: sprite
      id: player
      class: actor player
      image: assets/images/hero.svg
      x: 96
      y: 364
      width: 52
      height: 64
      color: "#66e3ff"
      variables:
        velocity_x: 0
        velocity_y: 0
        grounded: false
      animations:
        run:
          scale:
            from: 1
            to: 1.06
      components:
        - type: ImageSprite
          source: assets/images/hero.svg
          cache: async
        - type: Transform
          x: 96
          y: 364
        - type: PlatformerBody
          gravity: 1600
          move_speed: 340
          jump_velocity: -650
    - type: sprite
      id: goal
      class: collectible goal
      x: 2440
      y: 350
      width: 58
      height: 88
      color: "#facc15"
      components:
        - type: ShaderMaterial
          material: hologram
          vertex: assets/shaders/screen.vert
          fragment: assets/shaders/hologram.frag
          uniforms:
            strength: 0.45
        - type: Goal
    - type: platform
      id: ground
      class: solid
      x: 0
      y: 488
      width: 2600
      height: 52
      color: "#334155"
      components:
        - type: Geometry
          shape: rect
    - type: platform
      id: ledge_left
      class: solid
      x: 260
      y: 398
      width: 190
      height: 28
      color: "#64748b"
      components:
        - type: Geometry
          shape: rect
    - type: platform
      id: ledge_mid
      class: solid
      x: 650
      y: 326
      width: 210
      height: 28
      color: "#64748b"
      components:
        - type: Geometry
          shape: rect
    - type: platform
      id: ledge_ridge
      class: solid
      x: 1080
      y: 388
      width: 250
      height: 28
      color: "#64748b"
      components:
        - type: Geometry
          shape: rect
    - type: platform
      id: ledge_goal
      class: solid
      x: 2210
      y: 438
      width: 360
      height: 28
      color: "#64748b"
      components:
        - type: Geometry
          shape: rect
    - type: text
      id: instructions
      x: 24
      y: 32
      text: "Horizontal SUGI platformer · A/D or arrows to run · W/Space to jump · reach the hologram gate"
      color: "#e2e8f0"
      font_size: 20
      components:
        - type: Text
          value: "Horizontal SUGI platformer · A/D or arrows to run · W/Space to jump · reach the hologram gate"
          size: 20
