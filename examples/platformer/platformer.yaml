page:
  id: platformer_scene
  styles:
    layout: absolute
  width: 960
  height: 540
  background: "#101827"
  variables:
    gravity: 1600
    move_speed: 260
    jump_velocity: -620
  children:
    - type: camera
      id: camera
      x: 0
      y: 0
      width: 960
      height: 540
      components:
        - type: Transform
          x: 0
          y: 0
        - type: Camera
          target: player
    - type: sprite
      id: player
      class: actor player
      x: 96
      y: 368
      width: 40
      height: 56
      color: "#66e3ff"
      variables:
        velocity_x: 0
        velocity_y: 0
        grounded: false
      components:
        - type: Transform
          x: 96
          y: 368
        - type: Geometry
          shape: rect
          width: 40
          height: 56
        - type: PlatformerBody
          gravity: 1600
          move_speed: 260
          jump_velocity: -620
    - type: sprite
      id: goal
      class: collectible
      x: 850
      y: 330
      width: 42
      height: 78
      color: "#facc15"
      components:
        - type: Transform
          x: 850
          y: 330
        - type: Geometry
          shape: rect
          width: 42
          height: 78
        - type: Goal
    - type: platform
      id: ground
      class: solid
      x: 0
      y: 488
      width: 960
      height: 52
      color: "#475569"
      components:
        - type: Transform
          x: 0
          y: 488
        - type: Geometry
          shape: rect
          width: 960
          height: 52
    - type: platform
      id: ledge_left
      class: solid
      x: 210
      y: 396
      width: 160
      height: 28
      color: "#64748b"
      components:
        - type: Transform
          x: 210
          y: 396
        - type: Geometry
          shape: rect
          width: 160
          height: 28
    - type: platform
      id: ledge_mid
      class: solid
      x: 455
      y: 318
      width: 170
      height: 28
      color: "#64748b"
      components:
        - type: Transform
          x: 455
          y: 318
        - type: Geometry
          shape: rect
          width: 170
          height: 28
    - type: text
      id: instructions
      x: 24
      y: 28
      text: "Move: A/D or ←/→    Jump: W/Space/↑    Reach the gold door"
      color: "#e2e8f0"
      components:
        - type: Transform
          x: 24
          y: 28
        - type: Text
          value: "Move: A/D or ←/→    Jump: W/Space/↑    Reach the gold door"
          size: 20
