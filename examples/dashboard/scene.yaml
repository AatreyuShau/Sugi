page:
  id: dashboard_showcase
  width: 1280
  height: 720
  background: "#020617"
  variables:
    viewport_width: 1280
    viewport_height: 720
  children:
    - type: text
      id: title
      text: "Dashboard: protocol, camera, layout, subscriptions"
      x: 48
      y: 64
      color: "#f8fafc"
      font_size: 32
    - type: camera
      id: main_camera
      x: 48
      y: 100
      width: 280
      height: 220
      color: "#1e293b"
      components:
        - type: Camera
          zoom: 1
          follow: revenue_chart
          screen_shake: 0
    - type: panel
      id: revenue_chart
      class: metric selected
      tags: [dashboard, chart]
      x: 360
      y: 100
      width: 380
      height: 220
      color: "#0f766e"
      states:
        loading: false
      components:
        - type: Transform
          opacity: 0.94
        - type: Glow
          strength: 0.28
    - type: panel
      id: event_monitor
      x: 772
      y: 100
      width: 420
      height: 220
      color: "#312e81"
      components:
        - type: Text
          value: subscribe/unsubscribe property_changed animation_finished
      events:
        mousemove:
          - call: app_updates_metric_hover
    - type: panel
      id: grid_layout
      x: 48
      y: 360
      width: 1144
      height: 220
      color: "#111827"
      styles:
        layout: grid
        columns: 4
      components:
        - type: ScrollLock
          start: 0
          end: 240
        - type: Blur
          radius: 8
